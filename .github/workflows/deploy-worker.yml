name: Auto Sync, Obfuscate & Deploy Worker

on:
  schedule:
    - cron: '0 2 * * *' # 每天凌晨2点自动同步执行
  workflow_dispatch: # 允许手动点击运行
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # 安装 terser 进行模块化混淆，取代 esbuild/javascript-obfuscator
        run: npm install -g terser wrangler

      - name: Fetch upstream _worker.js
        run: |
          curl -sL "https://raw.githubusercontent.com/yonggekkk/Cloudflare-vless-trojan/main/Vless_workers_pages/_worker.js" -o _worker.js
          
      - name: Obfuscate Code
        run: |
          # 关键修复：必须加上 --module，否则 export default 会被破坏，导致部署失败！
          # --mangle 会打乱并混淆所有中英文变量名，实现真正的混淆防封。
          terser _worker.js --compress --mangle --module -o obfuscated_worker.js

      - name: Create wrangler.toml
        run: |
          cat << 'EOF' > wrangler.toml
          name = "vless-trojan-2026"
          main = "obfuscated_worker.js"
          compatibility_date = "2026-01-20"

          # 终极兼容：不管上游脚本要的是 u、U、uuid 还是 UUID，我们全给它注入，绝对不会再报变量名错误！
          [vars]
          UUID = "24d47812-01cb-450a-90bf-977925b52fe5"
          uuid = "24d47812-01cb-450a-90bf-977925b52fe5"
          U = "24d47812-01cb-450a-90bf-977925b52fe5"
          u = "24d47812-01cb-450a-90bf-977925b52fe5"

          [[routes]]
          pattern = "20261003yg-aotu.209app.ccwu.cc"
          custom_domain = true
          EOF

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CI: true
        run: |
          # 加上 debug 模式，如果还有任何网络/CF账号配置问题，日志会写得一清二楚
          wrangler deploy --log-level debug
