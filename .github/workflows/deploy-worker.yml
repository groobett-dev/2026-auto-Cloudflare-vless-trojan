name: Auto Sync, Obfuscate & Deploy Worker

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Vless_workers_pages/_worker.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install -g terser

      - name: Obfuscate Code
        run: |
          terser Vless_workers_pages/_worker.js --compress --mangle --module -o obfuscated_worker.js

      - name: Create wrangler.toml
        run: |
          cat << 'EOF' > wrangler.toml
          name = "vless-trojan-2026"
          main = "obfuscated_worker.js"
          compatibility_date = "2026-01-20"

          [vars]
          UUID = "${{ secrets.WORKER_VAR_UUID }}"
          uuid = "${{ secrets.WORKER_VAR_UUID }}"
          U = "${{ secrets.WORKER_VAR_UUID }}"
          u = "${{ secrets.WORKER_VAR_UUID }}"

          [[routes]]
          pattern = "20261003yg-aotu.209app.ccwu.cc"
          custom_domain = true
          EOF

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        env:
          # 这次已经移到了 env 里面，绝对不会再报 Unexpected input 错误了！
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
