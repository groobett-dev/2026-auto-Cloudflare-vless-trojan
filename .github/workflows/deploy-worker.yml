name: Auto Sync, Obfuscate & Deploy Worker

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install -g terser

      - name: Fetch upstream _worker.js
        run: |
          curl -sL "https://raw.githubusercontent.com/yonggekkk/Cloudflare-vless-trojan/main/Vless_workers_pages/_worker.js" -o _worker.js
          
      - name: Obfuscate Code
        run: |
          terser _worker.js --compress --mangle --module -o obfuscated_worker.js

      - name: Create wrangler.toml
        # 使用 Secrets 动态替换 UUID，绝不泄露明文
        run: |
          cat << 'EOF' > wrangler.toml
          name = "vless-trojan-2026"
          main = "obfuscated_worker.js"
          compatibility_date = "2026-01-20"

          [vars]
          UUID = "${{ secrets.WORKER_VAR_UUID }}"
          uuid = "${{ secrets.WORKER_VAR_UUID }}"
          U = "${{ secrets.WORKER_VAR_UUID }}"
          u = "${{ secrets.WORKER_VAR_UUID }}"

          [[routes]]
          pattern = "20261003yg-aotu.209app.ccwu.cc"
          custom_domain = true
          EOF

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiKey: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          email: ${{ secrets.CLOUDFLARE_EMAIL }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --log-level debug
