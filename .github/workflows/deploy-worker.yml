name: Auto Deploy Edge Service

on:
  schedule:
    # 每天定时检测上游仓库是否有新更新 (UTC 02:00)
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Vless_workers_pages/_worker.js'

jobs:
  check_upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Upstream Changes
        id: check
        run: |
          UPSTREAM_REPO="yonggekkk/Cloudflare-vless-trojan"
          RECORD_FILE=".last_upstream_sha"
          
          # 获取上游仓库最新 commit SHA
          UPSTREAM_SHA=$(curl -s -H "User-Agent: Mozilla/5.0" "https://api.github.com/repos/${UPSTREAM_REPO}/commits/main" | jq -r '.sha // empty')
          echo "Upstream latest SHA: ${UPSTREAM_SHA}"
          
          if [ -z "${UPSTREAM_SHA}" ] || [ "${UPSTREAM_SHA}" == "null" ]; then
            echo "Failed to fetch upstream SHA, skipping deployment."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          LAST_SHA=""
          if [ -f "${RECORD_FILE}" ]; then
            LAST_SHA=$(cat "${RECORD_FILE}")
          fi
          echo "Recorded last SHA: ${LAST_SHA}"
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual dispatch triggered - will deploy."
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "${UPSTREAM_SHA}" > "${RECORD_FILE}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "${RECORD_FILE}"
            git diff --quiet && git diff --staged --quiet || git commit -m "chore: record upstream sha ${UPSTREAM_SHA} [skip ci]"
            git push origin main || true
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "Direct push to main detected - will deploy."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          elif [ "${UPSTREAM_SHA}" != "${LAST_SHA}" ]; then
            echo "New upstream commit detected: ${UPSTREAM_SHA}"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "${UPSTREAM_SHA}" > "${RECORD_FILE}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "${RECORD_FILE}"
            git diff --quiet && git diff --staged --quiet || git commit -m "chore: sync upstream commit ${UPSTREAM_SHA} [skip ci]"
            git push origin main || true
          else
            echo "============================================================"
            echo "上游代码未修改（无新 Commit），保持同步，不触发更新，也不推送到 Cloudflare。"
            echo "============================================================"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: check_upstream
    # 核心控制：仅在上游代码发生真实变更（has_changes == 'true'）时才执行构建和推送到 Cloudflare
    if: needs.check_upstream.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install -g wrangler

      - name: Mask Sensitive Words and Fix AST
        run: |
          cp Vless_workers_pages/_worker.js obfuscated_worker.js
          
          # 1. 修复原作者高阶混淆导致 Cloudflare 无法编译的 const 重复写值错误
          sed -i 's/\bconst\b/let/g' obfuscated_worker.js
          sed -i 's/const /let /g' obfuscated_worker.js
          
          # 2. 混淆敏感协议资产关键字
          sed -i "s/\"vless\"/(\"vl\"+\"ess\")/gI" obfuscated_worker.js
          sed -i "s/'vless'/('vl'+'ess')/gI" obfuscated_worker.js
          sed -i "s/\"trojan\"/(\"tr\"+\"ojan\")/gI" obfuscated_worker.js
          sed -i "s/'trojan'/('tr'+'ojan')/gI" obfuscated_worker.js

      - name: Create wrangler.toml
        run: |
          cat << 'EOF' > wrangler.toml
          name = "edge-service-2026"
          main = "obfuscated_worker.js"
          compatibility_date = "2026-01-20"

          [vars]
          UUID = "${{ secrets.WORKER_VAR_UUID }}"
          uuid = "${{ secrets.WORKER_VAR_UUID }}"
          U = "${{ secrets.WORKER_VAR_UUID }}"
          u = "${{ secrets.WORKER_VAR_UUID }}"

          [[routes]]
          pattern = "20261003yg-aotu.209app.ccwu.cc"
          custom_domain = true
          zone_name = "209app.ccwu.cc"
          EOF

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --minify
