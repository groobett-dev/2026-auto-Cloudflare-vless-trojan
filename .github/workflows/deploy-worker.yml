name: Auto Sync, Obfuscate & Deploy Worker

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Vless_workers_pages/_worker.js'

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 使用具有写权限的 token，以便可以推送到 GitHub
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync upstream code and push to GitHub
        run: |
          # 1. 抓取上游最新代码覆盖本地文件
          curl -sL "https://raw.githubusercontent.com/yonggekkk/Cloudflare-vless-trojan/main/Vless_workers_pages/_worker.js" -o Vless_workers_pages/_worker.js
          
          # 2. 检查是否有更新，如果有则自动推送到您的 GitHub 仓库
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Vless_workers_pages/_worker.js
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto sync upstream _worker.js"
            git push
          fi

      - name: Install dependencies
        run: npm install -g terser

      - name: Obfuscate Code
        run: |
          # 读取本地已被同步的文件进行混淆
          terser Vless_workers_pages/_worker.js --compress --mangle --module -o obfuscated_worker.js

      - name: Create wrangler.toml
        run: |
          cat << 'EOF' > wrangler.toml
          name = "vless-trojan-2026"
          main = "obfuscated_worker.js"
          compatibility_date = "2026-01-20"

          [vars]
          UUID = "${{ secrets.WORKER_VAR_UUID }}"
          uuid = "${{ secrets.WORKER_VAR_UUID }}"
          U = "${{ secrets.WORKER_VAR_UUID }}"
          u = "${{ secrets.WORKER_VAR_UUID }}"

          [[routes]]
          pattern = "20261003yg-aotu.209app.ccwu.cc"
          custom_domain = true
          EOF

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --log-level debug
