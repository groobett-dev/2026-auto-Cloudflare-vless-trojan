name: Auto Sync, Obfuscate & Deploy Worker

on:
  schedule:
    - cron: '0 2 * * *' # 每天凌晨2点自动同步执行
  workflow_dispatch: # 允许手动点击运行
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install -g esbuild wrangler

      - name: Fetch upstream _worker.js
        run: |
          curl -sL "https://raw.githubusercontent.com/yonggekkk/Cloudflare-vless-trojan/main/Vless_workers_pages/_worker.js" -o _worker.js
          
      - name: Obfuscate Code
        run: |
          esbuild _worker.js --minify --outfile=obfuscated_worker.js

      - name: Create wrangler.toml
        run: |
          cat << 'EOF' > wrangler.toml
          name = "vless-trojan-2026"
          main = "obfuscated_worker.js"
          compatibility_date = "2026-01-20"

          [vars]
          uuid = "24d47812-01cb-450a-90bf-977925b52fe5"

          [[routes]]
          pattern = "20261003yg-aotu.209app.ccwu.cc"
          custom_domain = true
          EOF

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          wrangler deploy
