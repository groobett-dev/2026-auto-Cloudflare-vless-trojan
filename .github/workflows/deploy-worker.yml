name: Auto Deploy Edge Service

on:
  schedule:
    # 每天定时检测上游仓库是否有新代码更新 (UTC 02:00 / 北京时间 10:00)
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Vless_workers_pages/_worker.js'

jobs:
  check_upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Upstream Changes
        id: check
        run: |
          UPSTREAM_REPO="yonggekkk/Cloudflare-vless-trojan"
          RECORD_FILE=".last_upstream_sha"
          
          # 获取上游仓库最新 commit SHA
          UPSTREAM_SHA=$(curl -s -H "User-Agent: Mozilla/5.0" "https://api.github.com/repos/${UPSTREAM_REPO}/commits/main" | jq -r '.sha // empty')
          echo "Upstream latest SHA: ${UPSTREAM_SHA}"
          
          if [ -z "${UPSTREAM_SHA}" ] || [ "${UPSTREAM_SHA}" == "null" ]; then
            echo "Failed to fetch upstream SHA, skipping deployment."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          LAST_SHA=""
          if [ -f "${RECORD_FILE}" ]; then
            LAST_SHA=$(cat "${RECORD_FILE}")
          fi
          echo "Recorded last SHA: ${LAST_SHA}"
          
          # 判断是否有更新或为手动触发
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual dispatch triggered - will sync and deploy."
            HAS_CHANGES="true"
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "Direct push to main detected - will deploy."
            HAS_CHANGES="true"
          elif [ "${UPSTREAM_SHA}" != "${LAST_SHA}" ]; then
            echo "New upstream commit detected: ${UPSTREAM_SHA}"
            HAS_CHANGES="true"
          else
            echo "============================================================"
            echo "上游代码未修改（Commit 无变化），保持同步，不拉取，不推送，不向 Cloudflare 部署。"
            echo "============================================================"
            HAS_CHANGES="false"
          fi
          
          echo "has_changes=${HAS_CHANGES}" >> $GITHUB_OUTPUT
          
          # 仅当有更新或手动触发时，拉取上游代码并处理
          if [ "${HAS_CHANGES}" == "true" ]; then
            echo "Fetching upstream _worker.js..."
            curl -s -H "User-Agent: Mozilla/5.0" "https://raw.githubusercontent.com/${UPSTREAM_REPO}/main/Vless_workers_pages/_worker.js" -o Vless_workers_pages/_worker.js
            
            # 运行脚本修复 AST 并将 // 注释翻译为中文
            python scripts/transform.py Vless_workers_pages/_worker.js Vless_workers_pages/_worker.js
            
            echo "${UPSTREAM_SHA}" > "${RECORD_FILE}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "${RECORD_FILE}" Vless_workers_pages/_worker.js
            git diff --quiet && git diff --staged --quiet || git commit -m "chore: sync upstream ${UPSTREAM_SHA:0:8} + translate comments to Chinese [skip ci]"
            git push origin main || true
          fi

  deploy:
    needs: check_upstream
    # 核心安全门禁：上游不更新则不执行、不推送、不向 Cloudflare 部署、零报错
    if: needs.check_upstream.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install -g wrangler

      - name: Prepare Worker Script
        run: |
          # 无论代码拉取途径如何，确保 const 替换为 let 以彻底避免 esbuild 编译报错
          sed -i 's/\bconst\b/let/g' Vless_workers_pages/_worker.js

      - name: Create wrangler.toml
        run: |
          cat << 'EOF' > wrangler.toml
          name = "edge-service-2026"
          main = "Vless_workers_pages/_worker.js"
          compatibility_date = "2026-01-20"
          workers_dev = false

          [vars]
          UUID = "${{ secrets.WORKER_VAR_UUID }}"
          uuid = "${{ secrets.WORKER_VAR_UUID }}"
          U = "${{ secrets.WORKER_VAR_UUID }}"
          u = "${{ secrets.WORKER_VAR_UUID }}"

          [[routes]]
          pattern = "20261003yg-aotu.209app.ccwu.cc"
          custom_domain = true
          zone_name = "209app.ccwu.cc"

          [[routes]]
          pattern = "20261003-auto-yg.209app.ccwu.cc"
          custom_domain = true
          zone_name = "209app.ccwu.cc"
          EOF

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --minify